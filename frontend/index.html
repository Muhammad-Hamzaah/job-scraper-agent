<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobScout</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">JobScout</a>
  </header>

  <main>
    <section class="search-wrap" aria-label="Job search">
      <form id="search-form" class="search-bar" novalidate>
        <label class="field what-field">
          <span class="visually-hidden">Job title or keywords</span>
          <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M16.5 16.5L21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="keyword" name="keyword" type="text" maxlength="100"
                 placeholder="Job title or keywords" autocomplete="off">
        </label>

        <label class="field where-field">
          <span class="visually-hidden">Country</span>
          <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 22s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="12" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
          </svg>
          <select id="country" name="country" aria-label="Country"></select>
        </label>

        <label class="field city-field">
          <span class="visually-hidden">City (optional)</span>
          <input id="city" name="city" type="text" maxlength="100"
                 placeholder="City (optional)" autocomplete="off">
        </label>

        <button type="submit" class="find-btn" id="find-btn">Find jobs</button>
      </form>
      <p id="form-error" class="form-error" role="alert" hidden></p>
    </section>

    <p id="status" class="status" aria-live="polite"></p>

    <div id="results-section" class="results-section" hidden>
      <div class="filter-row">
        <div class="filter-pills">
          <label class="pill">
            <span>Date posted</span>
            <select id="filter-date" aria-label="Date posted">
              <option value="any">Any time</option>
              <option value="1">Last 24 hours</option>
              <option value="3">Last 3 days</option>
              <option value="7">Last 7 days</option>
              <option value="14">Last 14 days</option>
            </select>
          </label>
          <label class="pill">
            <span>Job type</span>
            <select id="filter-type" aria-label="Job type">
              <option value="all">All types</option>
            </select>
          </label>
          <label class="pill">
            <span>Source</span>
            <select id="filter-source" aria-label="Source">
              <option value="all">All sources</option>
            </select>
          </label>
          <button type="button" id="clear-filters" class="clear-filters" hidden>Clear filters</button>
        </div>
        <label class="pill sort-pill">
          <span>Sort</span>
          <select id="sort" aria-label="Sort jobs">
            <option value="relevance">Relevance</option>
            <option value="date">Date (newest)</option>
          </select>
        </label>
      </div>

      <p id="result-count" class="result-count" aria-live="polite"></p>

      <div class="results-layout">
        <div class="list-col">
          <div id="job-list" class="job-list" role="listbox" aria-label="Job results"></div>
          <div id="pagination" class="pagination" hidden>
            <button type="button" id="prev-page">Previous</button>
            <span id="page-info"></span>
            <button type="button" id="next-page">Next</button>
          </div>
        </div>

        <aside id="detail-pane" class="detail-pane" aria-live="polite">
          <button type="button" id="back-btn" class="back-btn">Back to results</button>
          <div id="detail-empty" class="detail-empty">Select a job to see details.</div>
          <div id="detail-content" hidden></div>
        </aside>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
